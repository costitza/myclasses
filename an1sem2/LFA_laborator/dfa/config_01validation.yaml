name: "Contains01"
description: "A DFA that accepts any binary string containing the substring '01'"

alphabet: 
  - "0"
  - "1"

states: 
  - "q0" # Start state: hasn't seen '0' yet
  - "q1" # Has seen a '0', waiting for a '1'
  - "q2" # Has seen '01', this is the accept/trap state

start_state: "q0"

accept_states: 
  - "q2"

transitions:
  q0:
    "0": "q1"
    "1": "q0"
  q1:
    "0": "q1"
    "1": "q2"
  q2:
    "0": "q2"
    "1": "q2"